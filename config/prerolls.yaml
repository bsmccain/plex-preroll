# Use media visible at the same paths to this command and Plex.
# Plex needs read access to play the videos.
seasons:
  - name: halloween
    from: "10-01"
    to: "10-31"
    files:
      - /media/prerolls/halloween/

  - name: thanksgiving
    from: "11-20"
    to: "11-30"
    files:
      - /media/prerolls/thanksgiving/turkeys.mp4

  - name: christmas
    from: "11-20"
    to: "01-06"
    files:
      - /media/prerolls/christmas/santa.mp4
      - /media/prerolls/christmas/snowman.mp4

default:
  - /media/prerolls/default/intro.mp4
